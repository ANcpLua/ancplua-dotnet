name: Verify Submission Studio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/prepare-plugin-submission
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -B -m unittest discover -s tests -v
      - run: python3 -B -m unittest discover -s evals/runtime -v
      - run: npm ci
        working-directory: packages/prepare-plugin-submission/skills/prepare-plugin-submission/assets/connector-kit
      - run: npm run build
        working-directory: packages/prepare-plugin-submission/skills/prepare-plugin-submission/assets/connector-kit
