name: Verify compiler and runtime probes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install the NativeAOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Compile and execute probes, including the NativeAOT publish
        run: python3 scripts/verify.py --native-aot --report "$RUNNER_TEMP/union-verification.json"
      - name: Check link and synchronization tooling
        run: python3 -B -m unittest discover -s scripts/tests -v
      # The report is a convenience copy; the verify step's exit code is the result. The account's
      # artifact storage quota made this upload fail on 2026-11-10 and 2026-11-15, so a failed upload
      # must not fail the run, and a short retention keeps storage use low.
      - name: Upload verification report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-report
          path: ${{ runner.temp }}/union-verification.json
          if-no-files-found: warn
          retention-days: 1
